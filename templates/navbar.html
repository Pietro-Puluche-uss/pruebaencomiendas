<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="{% url 'dashboard' %}">
            <i class="fas fa-shipping-fast me-2"></i>Encomiendas
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMain"
            aria-controls="navbarMain"
            aria-expanded="false"
            aria-label="Toggle navigation"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        {% if user.is_authenticated %}
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{% url 'dashboard' %}">
                        Dashboard
                        <span class="badge bg-light text-primary ms-1">{{ nav_activas|default:0 }}</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if '/encomiendas/' in request.path %}active{% endif %}" href="{% url 'encomienda_lista' %}">
                        Encomiendas
                        {% if nav_retraso %}
                        <span class="badge bg-danger rounded-pill ms-1">{{ nav_retraso }}</span>
                        {% endif %}
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/encomiendas/nueva/' %}active{% endif %}" href="{% url 'encomienda_crear' %}">
                        Nueva
                    </a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2">
                <a class="btn btn-sm btn-outline-light" href="{% url 'perfil' %}">
                    <i class="fas fa-user me-1"></i>{{ user.username }}
                </a>
                <a class="btn btn-sm btn-light" href="{% url 'logout' %}">
                    <i class="fas fa-sign-out-alt me-1"></i>Salir
                </a>
            </div>
        </div>
        {% else %}
        <a class="btn btn-outline-light" href="{% url 'login' %}">
            <i class="fas fa-sign-in-alt me-1"></i>Iniciar sesion
        </a>
        {% endif %}
    </div>
</nav>
